<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Fetcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
        .header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 6px; }

        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input[type="url"] { width: 100%; padding: 14px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input[type="url"]:focus { border-color: var(--accent); }

        button.btn-fetch { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        button.btn-fetch:hover { background: var(--accent-hover); }

        #spinner { display: none; text-align: center; margin: 24px 0; color: var(--text-muted); font-size: 0.9rem; }
        
        #resultContainer { display: none; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .media-preview { width: 100%; border-radius: 10px; object-fit: cover; aspect-ratio: 16/9; margin-bottom: 12px; }
        .media-title { font-size: 1rem; font-weight: 600; line-height: 1.4; margin-bottom: 16px; color: var(--text-main); }
        
        .format-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
        .download-btn { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: border-color 0.2s, background 0.2s; }
        .download-btn:hover { border-color: var(--success); background: #162032; }
        .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--border); color: var(--text-muted); text-transform: uppercase; }
        .badge.video { background: #1e1b4b; color: #818cf8; }
        .badge.audio { background: #064e3b; color: #34d399; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Downloader</h1>
        <p>Paste a video link below to extract download options.</p>
    </div>

    <div class="input-group">
        <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
        <button class="btn-fetch" onclick="processVideo()">Extract Formats</button>
    </div>

    <div id="spinner">Processing details...</div>

    <div id="resultContainer">
        <img id="thumb" class="media-preview" src="" alt="Preview">
        <div id="title" class="media-title"></div>
        <div id="formatList" class="format-list"></div>
    </div>
</div>

<script>
    async function processVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const spinner = document.getElementById('spinner');
        const container = document.getElementById('resultContainer');
        const formatList = document.getElementById('formatList');

        if (!urlInput) return alert('Please enter a valid link.');

        spinner.style.display = 'block';
        container.style.display = 'none';
        formatList.innerHTML = '';

        try {
            const response = await fetch('/api/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();
            spinner.style.display = 'none';

            if (data.error) return alert(data.error);

            document.getElementById('thumb').src = data.thumbnail;
            document.getElementById('title').innerText = data.title;

            data.formats.forEach(f => {
                const link = document.createElement('a');
                link.className = 'download-btn';
                link.href = f.download_url;
                link.target = '_blank';
                
                const typeClass = f.has_video ? 'video' : 'audio';
                const labelText = f.has_video ? f.resolution : 'Audio Only';

                link.innerHTML = `
                    <span>${labelText} (${f.ext.toUpperCase()})</span>
                    <span class="badge ${typeClass}">${f.has_video ? 'Video' : 'Audio'}</span>
                `;
                formatList.appendChild(link);
            });

            container.style.display = 'block';
        } catch (err) {
            spinner.style.display = 'none';
            alert('Failed to connect to the backend server.');
        }
    }
</script>
</body>
</html>
